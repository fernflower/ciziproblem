# CERMAT (aka Czech Hunger Games) 101


### Everybody Lies

Do not trust school feedback. Sadly a report card with `samé jedničky` does not mean anything. The public school curriculum is inadequate - it is too shallow and does not scratch the surface of the tricky cermat questions and for kids to have a fighting chance it is on parents to bridge the gap.

### Location, location, location

If you have been fighting tooth and nail to stay in Prague or Brno to offer your child the best opportunities - I have bad news for you. The situation in Prague is absolutely horrific - 5218 kids for 1741 spots in year 2026, an average public school will have 8-10 kids competing for a single spot. 

Brno comes second in this rating.

The farther from those 2 regions you are - the easier it is to get in without massive consequencies to your family's mental and financial health.

For more details about number of application vs number of slots in your region please check [this interactive schools map](https://app.powerbi.com/view?r=eyJrIjoiYzQyMDNhOGQtMGU1Ni00NzA2LTg0OWQtYjk4MzllZjNjOGI4IiwidCI6Ijc4ODJmYzNiLTRhOTAtNDk4Ny05MmQ4LTNlMzFiODE4ZTZjNSIsImMiOjh9&disablecdnExpiration=1772557058).

### Choose your legendary trio

You will need to choose up to 3 schools:

1. dream school
2. strong second choice (less points required than #1)
3. safety net (significantly less points required than #1)

You can use [the interactive map](https://app.powerbi.com/view?r=eyJrIjoiYzQyMDNhOGQtMGU1Ni00NzA2LTg0OWQtYjk4MzllZjNjOGI4IiwidCI6Ijc4ODJmYzNiLTRhOTAtNDk4Ny05MmQ4LTNlMzFiODE4ZTZjNSIsImMiOjh9&disablecdnExpiration=1772557058) and compare statistics for previous years to try and predict how many points will be needed, but to make an informed final choice you should also double check the number of students school enrolls for the next school year - this information is published on the school website by the end of January.

All applications must be submitted via [DiPSy](https://dipsy.gov.cz/) by Feb, 20th.

Exams will be held for 2 days mid-April. Each day will start with a Math exam followed by a Czech exam with an up to 1.5 hour long break in-between. Then the best results of Czech and Math between those 2 attempts are taken as the final score.

If the school conducts any additional `Školní část` exams, they will take place separately from Cermat on a different day.

Parents are not allowed in the building, kid's photo ID of some kind is mandatory.

### Trip down memory lane

Cermat exam complexity fluctuates year to year. Ex. 78 points scored in 2024 (simple tests) can't be compared to the same result in 2025 (complex math) or 2026 (balance finally achieved).
Use [matematicka beruska](https://www.matematickaberuska.cz/) to find out how many points were enough to get into your schools of choice in a particular year.

Entry criteriums can also change year to year - some schools have additional rounds of exams / interviews / give bonus points for [certain Olympiads](https://msmt.gov.cz/mladez/titulni-stranka-mladez-aktuality-informativni-seznam-soutezi). Make sure that you take this into consideration when comparing results as those non-Cermat parts can make up for 40% of the final result sum. 

### Study materials, tips & tricks

Previous cermat tests can be found at [the official website](https://prijimacky.cermat.cz/menu/testova-zadani-k-procvicovani/testova-zadani-v-pdf), there is also a [configurable interactive training option](https://tau.cermat.cz/). There are no solutions published though. 

#### Math

For 8 year gymnazium almost every problem can be solved with plain equations (keep in mind this is usually *not* a technic taught at public schools!).

If you have the luxury of extra time I highly recommend [this exercise book](https://old.mccme.ru/free-books/pdf/kozlova.pdf) to get into the right mindspace. Don't be scared away by cyrillics, RU -> EN google translation is more than decent!

Matematicka beruska has [a list of recommended paperback materials](https://www.matematickaberuska.cz/chystame-se-na-zkousky/materialy-primo-ke-zkouskam/) as well.

It is also worth checking out the previous years of [Matematicka Olympiada](https://www.matematickaolympiada.cz/mo-pro-zs/rocnik), especially if you are looking to improve 14th task solving rate.

#### Czech

Unless you are a native speaker Czech family with the great support system and home schooling opportunities - unfortunately you will be looking at private tutors / courses.

Anyway it is good to know that Czech tests for [the 5th graders](https://prijimacky.cermat.cz/menu/testova-zadani-k-procvicovani/testova-zadani-v-pdf/osmilete-obory-cesky-jazyk-a-literatura) are not conceptually different from [the 7th graders](https://prijimacky.cermat.cz/menu/testova-zadani-k-procvicovani/testova-zadani-v-pdf/sestilete-obory-cesky-jazyk-a-literatura) which gives you more training opportunities.

#### Trial runs

I highly recommend to visit at least a couple of trial exam runs (google `zkouska nanecisto cermat`) to get a hang of how to fill the exam sheet (geometry solution has to be outlined with a pen / corrected answers properly marked / time management strategy / etc).
Trial runs also will give an idea how your kid copes with the stress.

### Plan B

#### Second round of Cermat

Sometimes not all available spots are filled in the first round of exams. Usually this is the case of private schools with non-negligible tuition though.
If that is the case you can apply for the second round via DiPSy. The cermat score from the first round will be used; most schools that announce second round with have additional exams and/or interviews.

#### Třídy s rozšířenou výukou jazyků nebo matematiky [8G, 6G only]

Search for elementary schools that have one special class with extended Math or Language studies. To enroll there you will need to send an application and pass an entry exam. For further details you will need to contact the chosen school, just keep in mind that sometimes those exams are scheduled before the Cermat results are published.

#### Switch schools [8G, 6G only]

The general approach and quality of education differs drastically. You may find inspiration among [Mensa-approved schools](https://deti.mensa.cz/cs/mapa/mapa/) or various Olympiads' leaderbords (like [Matematicka Olympiada](https://www.matematickaolympiada.cz/mo-pro-zs/rocnik/75-rocnik)).

### You are not alone

Cermat year is an extremely stressful experience. A typical elementary school will not provide children any kind of additional support (if they do - it is a privilege, please value that and cherish those teachers!).
However there are communities where other invested parents are sharing tips and tricks and supporting one another. Emimino forum has an annual thread dedicated
to this year's cermat exams (google `prijimacky na gymnazia emimino`) - like [year 2026](https://www.emimino.cz/diskuse/prijimacky-na-osmileta-gymnazia-2026-558525/) or
[year 2025](https://www.emimino.cz/diskuse/prijimacky-2025-544202/).

Although majority of Czech politics prefer to ignore the problem with inadequate school capacities - there is a [campaign to add more spots in Prague](https://pridejzidli.cz/) so that the city would pay chosen private schools tuition for 1500 kids who got decent cermat scores but just happened to miss the bar because it is so high. 
